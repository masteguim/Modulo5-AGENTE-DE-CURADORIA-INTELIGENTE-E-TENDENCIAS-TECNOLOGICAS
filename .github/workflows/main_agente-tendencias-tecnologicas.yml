name: CI/CD - Backend FastAPI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests

      - name: Testes automatizados
        run: pytest -q

      - name: Verificar vulnerabilidades das dependências
        run: pip-audit -r requirements.txt

      - name: Preparar artefato para o Azure
        if: github.event_name != 'pull_request'
        run: |
          python -m venv antenv
          antenv/bin/python -m pip install -r requirements.txt

      - name: Enviar artefato para o deploy
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !antenv/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Baixar artefato
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Entrar no Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_9BE13F4443E04DFF9D5CFC6CF8E1E6D2 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_78B9EE37E8884D4D86BDEB006CEFCF8D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C0AFDDB41A2C4B92B180F88A5FD4A804 }}

      - name: Publicar no Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: agente-tendencias-tecnologicas
          slot-name: Production
